<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    @keyframes glow {
      0% { text-shadow: 0 0 4px #3b82f6, 0 0 10px #3b82f6; }
      50% { text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6, 0 0 30px #3b82f6; }
      100% { text-shadow: 0 0 4px #3b82f6, 0 0 10px #3b82f6; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(400px); }
    }
    .bg { fill: #0a0a0a; }
    .border { fill: none; stroke: #3b82f6; stroke-width: 2; }
    .text {
      font-family: monospace;
      font-size: 10px;
      fill: #3b82f6;
      white-space: pre;
      animation: glow 2s infinite alternate;
    }
    .scanline {
      fill: rgba(59, 130, 246, 0.1);
      width: 100%;
      height: 5px;
      animation: scanline 6s linear infinite;
    }
  </style>
  
  <rect class="bg" width="900" height="400" rx="8" />
  <rect class="border" width="900" height="400" rx="8" />
  <rect class="scanline" x="0" y="0" />
  
